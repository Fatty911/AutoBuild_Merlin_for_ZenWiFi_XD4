# CNB 云原生构建: 华硕 ZenWiFi XD4 梅林固件
#
# 与 GitHub Actions (Prepare_Build_Environment + Build_Merlin_Firmware) 等价的
# 平行构建通道 (用户 GitHub 账号曾被反滥用系统误伤暂停)。代码与 GH 侧同一提交
# 同步演进, 固件源码仍跟踪 SWRT-dev/asuswrt-bcm 的 386 分支。
#
# v1 与 GH 链路的差异:
# - 无 Prepare/Build 两段拆分与 prep-env 缓存, 单流水线每次全量构建;
# - 产物直接发成 CNB Release (git:release + attachments), 旧版清理暂未实现;
# - CNB 容器默认 root, 而上游 make.common prebuild_checks 拒绝 root 构建
#   (2026-09-28 首跑实测) → 依赖阶段创建 builder 用户, 后续阶段 runuser 执行。
"**":
  push:
    - name: merlin-xd4-firmware
      docker:
        image: ubuntu:22.04
      stages:
        - name: 系统依赖
          script: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            for pkg in \
              build-essential flex bison gawk git wget patch unzip texinfo gettext \
              autoconf automake libtool libtool-bin pkg-config gperf bzip2 xz-utils \
              make m4 perl python3 python3-pip rsync bc file cmake \
              g++-multilib gcc-multilib libncurses-dev zlib1g-dev libssl-dev \
              liblzo2-dev uuid-dev libelf-dev libxml2-dev libglib2.0-dev libltdl-dev \
              libexpat1-dev libvorbis-dev lib32z1-dev lib32stdc++6 lib32gcc-s1 \
              libc6-dev-i386 xsltproc gtk-doc-tools intltool autopoint autogen \
              autoconf-archive sharutils dos2unix 7zip msmtp xmlto qemu-utils \
              upx-ucl device-tree-compiler antlr3 lzip patchelf libproxy-dev \
              gengetopt binutils-dev curl zip sudo xxd binutils libz-dev libslang2 \
              groff-base diffutils sed mtd-utils subversion asciidoc libncurses5-dev pigz; do
              apt-get install -y "$pkg" >/dev/null 2>&1 || echo "包不可用(跳过): $pkg"
            done
            ln -sf /bin/bash /bin/sh
            for must in build-essential flex bison gawk liblzo2-dev libncurses-dev zlib1g-dev libssl-dev; do
              dpkg -s "$must" >/dev/null 2>&1 || { echo "关键依赖未安装: $must"; exit 1; }
            done
            id builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder
            usermod -aG sudo builder 2>/dev/null || true
            echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder
            chmod 440 /etc/sudoers.d/builder
            chown -R builder:builder "$PWD" /home/builder
        - name: 克隆上游源码 (SWRT 386)
          script: |
            runuser -u builder -- env HOME=/home/builder bash -c '
              git clone --depth 1 --single-branch --branch 386 \
                https://github.com/SWRT-dev/asuswrt-bcm asuswrt-bcm
              git -C asuswrt-bcm rev-parse HEAD | tee prep-source-rev.txt
            '
        - name: 应用 XD4 补丁 (含 archer 日志风暴修复)
          script: |
            runuser -u builder -- env HOME=/home/builder \
              bash custom_scripts/patch_xd4_source.sh asuswrt-bcm
        - name: 工具链 (bcmhnd + bcm)
          script: |
            runuser -u builder -- env HOME=/home/builder bash -c '
              set -e
              mkdir -p "/home/builder/toolchains"
              git clone --depth 1 --no-checkout --single-branch \
                https://github.com/SWRT-dev/bcmhnd-toolchains "/home/builder/toolchains/bcmhnd"
              git -C "/home/builder/toolchains/bcmhnd" archive --format=tar HEAD | tar x -C "/home/builder/toolchains/bcmhnd"
              git clone --depth 1 --no-checkout --single-branch \
                https://github.com/SWRT-dev/bcm-toolchains "/home/builder/toolchains/bcm"
              git -C "/home/builder/toolchains/bcm" archive --format=tar HEAD | tar x -C "/home/builder/toolchains/bcm"
            '
        - name: 挂载工具链到 /opt (root)
          script: |
            sudo mkdir -p /opt/toolchains /projects/bca/tools/linux/bin
            sudo chown -R builder /opt/toolchains /projects
            ln -sf "/home/builder/toolchains/bcmhnd"/crosstools-aarch64-gcc-5.3-linux-4.1-glibc-2.22-binutils-2.25 /opt/toolchains/
            ln -sf "/home/builder/toolchains/bcmhnd"/crosstools-arm-gcc-5.3-linux-4.1-glibc-2.22-binutils-2.25 /opt/toolchains/
            ln -sf "/home/builder/toolchains/bcmhnd"/crosstools-aarch64-gcc-5.3-linux-4.1-glibc-2.24-binutils-2.25 /opt/toolchains/
            ln -sf "/home/builder/toolchains/bcmhnd"/crosstools-aarch64-gcc-5.5-linux-4.1-glibc-2.26-binutils-2.28.1 /opt/toolchains/
            ln -sf "/home/builder/toolchains/bcmhnd"/crosstools-arm-gcc-5.3-linux-4.1-glibc-2.24-binutils-2.25 /opt/toolchains/
            ln -sf "/home/builder/toolchains/bcmhnd"/crosstools-arm-gcc-5.5-linux-4.1-glibc-2.26-binutils-2.28.1 /opt/toolchains/
            ln -sf "/home/builder/toolchains/bcmhnd"/crosstools-gcc-5.3-linux-4.1-uclibc-1.0.12-glibc-2.24-binutils-2.25 /opt/toolchains/
            ln -sf "/home/builder/toolchains/bcmhnd"/crosstools-aarch64-gcc-9.2-linux-4.19-glibc-2.30-binutils-2.32 /opt/toolchains/
            ln -sf "/home/builder/toolchains/bcmhnd"/crosstools-arm-gcc-9.2-linux-4.19-glibc-2.30-binutils-2.32 /opt/toolchains/
            ln -sf "/home/builder/toolchains/bcm"/hndtools-arm-linux-2.6.36-uclibc-4.5.3 /opt/toolchains/
            ln -sf "/home/builder/toolchains/bcm"/hndtools-armeabi-2013.11 /projects/bca/tools/linux/
            ln -sf "/home/builder/toolchains/bcm"/fwtag.ini /projects/bca/tools/linux/bin/
            ln -sf /projects/bca /projects/hnd
            ls /opt/toolchains/ | wc -l | xargs echo "toolchain links:"
        - name: 编译 rt-ax56_xd4
          timeout: 6h
          script: |
            runuser -u builder -- env HOME=/home/builder bash -c '
              set -e
              mkdir -p "$PWD/tmp" "$PWD/.cache" "$PWD/ccache"
              git config --global user.name "Fatty911"
              git config --global user.email "xuerui911@gmail.com"
              export TMPDIR="$PWD/tmp" TMP="$PWD/tmp" TEMP="$PWD/tmp"
              export XDG_CACHE_HOME="$PWD/.cache" CCACHE_DIR="$PWD/ccache"
              # make 全量输出进 build.log; 心跳每 60s 打一行尾部日志, 避免 CNB
              # 10 分钟无输出超时杀任务 (2026-09-28 实测死于 600090ms)
              make -C asuswrt-bcm/release/src-rt-5.02axhnd.675x rt-ax56_xd4 \
                > asuswrt-bcm/release/src-rt-5.02axhnd.675x/build.log 2>&1 &
              MPID=$!
              while kill -0 $MPID 2>/dev/null; do
                sleep 60
                echo "[heartbeat] $(date +%H:%M:%S) $(tail -c 100 asuswrt-bcm/release/src-rt-5.02axhnd.675x/build.log | tr "\n" " ")"
              done
              wait $MPID || { tail -60 asuswrt-bcm/release/src-rt-5.02axhnd.675x/build.log; exit 1; }
              tail -15 asuswrt-bcm/release/src-rt-5.02axhnd.675x/build.log
            '
        - name: 质量门
          script: |
            runuser -u builder -- env HOME=/home/builder GITHUB_WORKSPACE="$PWD" bash -c '
              SOURCE=SWRT_Merlin_386 EXPECTED_MODEL_PATTERN=RT-AX56_XD4 MIN_FIRMWARE_SIZE_MB=10 \
                python3 custom_scripts/validate_build_output.py --gate
            '
        - name: 收集产物
          script: |
            runuser -u builder -- env HOME=/home/builder bash -c '
              set -e
              FW_DIR="asuswrt-bcm/release/src-rt-5.02axhnd.675x/image"
              FW_FILE=$(ls "$FW_DIR"/*.w 2>/dev/null | grep -v cferom | head -1)
              if [ -z "$FW_FILE" ] || ! grep -qa "RT-AX56_XD4" "$FW_FILE"; then
                echo "未找到 XD4 固件输出"
                ls -la "$FW_DIR" 2>/dev/null || true
                exit 1
              fi
              mkdir -p dist
              sha256sum "$FW_FILE" > "$FW_FILE.sha256"
              cp -f "$FW_FILE" "$FW_FILE.sha256" dist/
              REVISION=$(cat prep-source-rev.txt)
              {
                echo "固件: $(basename "$FW_FILE")"
                echo "来源: SWRT_Merlin_386"
                echo "上游: https://github.com/SWRT-dev/asuswrt-bcm @ 386 ($REVISION)"
                echo "构建时间: $(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S %Z")"
                echo "软件中心: 已集成 (release/src/router/softcenter)"
                echo "SHA256: $(awk "{print \$1}" "$FW_FILE.sha256")"
                echo "修复: 内核 dev_queue_xmit_nit protocol-0000 日志风暴限速 (1条/10分钟)"
              } > dist/firmware-info.txt
              ls -la dist/
            '
        - name: 发布 Release (API, 幂等)
          script: |
            CNB_TOKEN="$CNB_TOKEN" python3 <<'PYEOF'
            # 内置 git:release 任务 push 事件下 tagname 为空必失败(2026-09-28 实测),
            # cnbcool/attachments 仓库公开不可见无法核实参数; 故改用官方 Release
            # REST API: 建/更 release + 预签名URL上传附件。流程已于本机实测打通。
            import base64, glob, json, os, sys, urllib.error, urllib.request
            API = ("https://api.cnb.cool/"
                   "xuerui911-mirror/AutoBuild_Merlin_for_ZenWiFi_XD4")
            TAG = "auto-build"
            TOKEN = os.environ.get("CNB_TOKEN", "")
            if not TOKEN:
                print("[FAIL] CNB_TOKEN 环境变量不存在"); sys.exit(1)
            AUTH = "Basic " + base64.b64encode(f"cnb:{TOKEN}".encode()).decode()

            def call(path, method="GET", form=None, raw=None):
                r = urllib.request.Request(API + path, method=method)
                r.add_header("Accept", "application/json")
                r.add_header("Authorization", AUTH)
                body = None
                if form is not None:
                    body = json.dumps(form, ensure_ascii=False).encode("utf-8")
                    r.add_header("Content-Type", "application/json; charset=utf-8")
                elif raw is not None:
                    body = raw
                try:
                    with urllib.request.urlopen(r, body, timeout=300) as resp:
                        return resp.status, resp.read()
                except urllib.error.HTTPError as e:
                    return e.code, e.read()

            files = sorted(glob.glob("dist/*"))
            if not files:
                print("[FAIL] dist/ 无产物"); sys.exit(1)

            body_txt = ("SWRT/Merlin 386 分支自动构建, 内置软件中心。\n\n"
                        "含 archer 日志风暴修复: 内核 dev_queue_xmit_nit 的"
                        " protocol-0000 告警限频为 1 条/10 分钟, 数据面无影响。\n\n")
            info = "dist/firmware-info.txt"
            if os.path.isfile(info):
                body_txt += open(info, encoding="utf-8", errors="replace").read()

            meta = {"tag_name": TAG,
                    "name": "XD4 梅林固件自动构建 (386, 含 archer 日志风暴修复)",
                    "body": body_txt, "draft": False, "prerelease": False,
                    "make_latest": "true",
                    "target_commitish": os.environ.get("CNB_COMMIT", "")}
            if not meta["target_commitish"]:
                del meta["target_commitish"]
            st, data = call(f"/-/releases/tags/{TAG}")
            if st == 200:
                rel = json.loads(data)
                # PATCH 返回 200 空 body(实测), 不可 json.loads; 直接复用 rel
                st2, data2 = call(f"/-/releases/{rel['id']}", method="PATCH", form=meta)
                print("[OK] release 已更新:", st2)
                if st2 != 200:
                    print("[FAIL] release 更新失败", st2, data2[:300]); sys.exit(1)
            else:
                st, data = call("/-/releases", method="POST", form=meta)
                print("[OK] release 已创建:", st)
                if st not in (200, 201):
                    print("[FAIL] release 创建失败", st, data[:300]); sys.exit(1)
                rel = json.loads(data)

            for f in files:
                if os.path.isdir(f):
                    continue
                size = os.path.getsize(f)
                # CNB 对"创建资源"语义返回 201 而非 200(实测 asset-upload-url=201),
                # 所有成功判断放宽为 2xx
                st, data = call(f"/-/releases/{rel['id']}/asset-upload-url",
                                method="POST",
                                form={"asset_name": os.path.basename(f),
                                      "overwrite": True, "size": size, "ttl": 180})
                if not (200 <= st < 300):
                    print(f"[FAIL] {f} 取上传URL失败", st, data[:200]); sys.exit(1)
                up = json.loads(data)
                st, data = call(up["upload_url"], method="PUT",
                                raw=open(f, "rb").read())
                if not (200 <= st < 300):
                    print(f"[FAIL] {f} PUT 失败", st, data[:200]); sys.exit(1)
                st, data = call(up["verify_url"], method="POST")
                if not (200 <= st < 300):
                    print(f"[FAIL] {f} 确认失败", st, data[:200]); sys.exit(1)
                print(f"[OK] 附件: {os.path.basename(f)} ({size} bytes)")
            print("[DONE] Release:", TAG)
            PYEOF
