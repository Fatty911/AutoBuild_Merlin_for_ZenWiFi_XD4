#
# 上游源码更新检查器（移植自 AutoBuild_OpenWrt_for_XiaoMi_R4 的 update_checker）
# 定期检查 SWRT-dev/asuswrt-bcm 386 分支 HEAD，有更新时通过 repository_dispatch
# 触发构建工作流（需要 ACTIONS_TRIGGER_PAT secret，已配置）。
#

name: Update Checker for Merlin

concurrency:
  group: update-checker-merlin
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/SWRT-dev/asuswrt-bcm
  REPO_BRANCH: 386

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get Commit Hash
        id: getHash
        run: |
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" . 2>/dev/null || \
            git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{print $1}' > /tmp/hash_fallback
          if [ -d .git ]; then
            COMMIT_HASH=$(git rev-parse HEAD)
          else
            COMMIT_HASH=$(cat /tmp/hash_fallback)
          fi
          echo "commitHash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
          echo "上游 $REPO_BRANCH HEAD: $COMMIT_HASH"

      - name: Compare Commit Hash
        id: cacheHash
        uses: actions/cache@main
        with:
          path: .commitHash
          key: HEAD-${{ steps.getHash.outputs.commitHash }}

      - name: Save New Commit Hash
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo "${{ steps.getHash.outputs.commitHash }}" | tee .commitHash

      - name: Trigger build
        if: steps.cacheHash.outputs.cache-hit != 'true'
        uses: peter-evans/repository-dispatch@main
        with:
          token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
          event-type: Merlin Source Code Update
          client-payload: '{"repo_url": "${{ env.REPO_URL }}", "branch": "${{ env.REPO_BRANCH }}"}'
