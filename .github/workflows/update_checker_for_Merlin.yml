#
# 上游源码更新检查器（移植自 AutoBuild_OpenWrt_for_XiaoMi_R4 的 update_checker，扩展为多分支）
# 定期检查 SWRT-dev/asuswrt-bcm 多个分支 HEAD（386 当前默认 + 24353/master 未来可能支持 XD4），
# 任一分支有更新时通过 repository_dispatch 触发构建工作流
# （需要 ACTIONS_TRIGGER_PAT secret，已配置；构建工作流用 client_payload.branch 选择分支）。
#

name: Update Checker for Merlin

concurrency:
  group: update-checker-merlin
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/SWRT-dev/asuswrt-bcm

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 386 = 当前 XD4 构建分支；24353/master = 388 线，未来若官方支持 XD4 会自动被发现
        branch: ['386', '24353', 'master']
    steps:
      - name: Get Commit Hash
        id: getHash
        run: |
          HASH=$(git ls-remote "$REPO_URL" "refs/heads/${{ matrix.branch }}" | awk '{print $1}')
          if [ -z "$HASH" ]; then
            echo "::warning::分支 ${{ matrix.branch }} 不存在，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commitHash=$HASH" >> "$GITHUB_OUTPUT"
          echo "上游 ${{ matrix.branch }} HEAD: $HASH"

      - name: Compare Commit Hash
        id: cacheHash
        if: steps.getHash.outputs.skip != 'true'
        uses: actions/cache@main
        with:
          path: .commitHash-${{ matrix.branch }}
          key: HEAD-${{ matrix.branch }}-${{ steps.getHash.outputs.commitHash }}

      - name: Save New Commit Hash
        if: steps.getHash.outputs.skip != 'true' && steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo "${{ steps.getHash.outputs.commitHash }}" | tee .commitHash-${{ matrix.branch }}

      - name: Trigger build
        # 只有默认分支 386 触发构建：24353/master 是 388 线，XD4 当前只支持 386，
        # 若全部 dispatch 会与 386 构建并发互杀（Build concurrency cancel-in-progress）
        if: steps.getHash.outputs.skip != 'true' && steps.cacheHash.outputs.cache-hit != 'true' && matrix.branch == '386'
        uses: peter-evans/repository-dispatch@main
        with:
          token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
          event-type: Merlin Source Code Update
          client-payload: '{"repo_url": "${{ env.REPO_URL }}", "branch": "${{ matrix.branch }}"}'
